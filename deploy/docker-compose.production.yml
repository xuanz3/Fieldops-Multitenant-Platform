services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fieldops-production-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fieldops} -d ${POSTGRES_DB:-fieldops}"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FieldOps: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fieldops};Username=${POSTGRES_USER:-fieldops};Password=${POSTGRES_PASSWORD}
      Authentication__Jwt__Issuer: ${JWT_ISSUER:-FieldOps.ProductionDemo}
      Authentication__Jwt__Audience: ${JWT_AUDIENCE:-FieldOps.ProductionDemo.Client}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FIELDOPS_WEB_PORT:-8088}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/web-health"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fieldops-production-data:
