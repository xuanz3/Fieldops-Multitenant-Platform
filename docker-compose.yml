services:
  postgres:
    image: postgres:17-alpine
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldops_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fieldops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldops} -d ${POSTGRES_DB:-fieldops}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fieldops-postgres-data:
