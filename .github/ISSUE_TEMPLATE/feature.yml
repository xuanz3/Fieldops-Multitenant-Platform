name: Feature request
description: Propose a scoped product capability
title: "feat: "
labels:
  - "type: feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or business problem.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the required observable behaviour.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions required for completion.
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risk and validation
      description: Describe security, data, testing and migration considerations.
    validations:
      required: true
