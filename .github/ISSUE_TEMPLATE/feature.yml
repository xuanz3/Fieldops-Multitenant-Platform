name: Feature
about: Propose a scoped product capability
labels: ["type: feature"]
body:
  - type: textarea
    attributes:
      label: Goal
      description: What user or business outcome is required?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Risks and evidence
      description: Record security, data, testing and screenshot needs.
