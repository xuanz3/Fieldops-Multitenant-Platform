name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FieldOps.sln
      - name: Build
        run: dotnet build FieldOps.sln --configuration Release --no-restore
      - name: Unit tests
        run: >
          dotnet test
          tests/FieldOps.UnitTests/FieldOps.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal

  postgres-integration:
    name: PostgreSQL integration and API security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fieldops
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldops_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldops -d fieldops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIELDOPS_TEST_CONNECTION: Host=localhost;Port=5432;Database=fieldops;Username=fieldops;Password=fieldops_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FieldOps.sln
      - name: Build integration tests
        run: >
          dotnet build
          tests/FieldOps.IntegrationTests/FieldOps.IntegrationTests.csproj
          --configuration Release
          --no-restore
      - name: Run PostgreSQL and API security tests
        run: >
          dotnet test
          tests/FieldOps.IntegrationTests/FieldOps.IntegrationTests.csproj
          --configuration Release
          --no-build
          --verbosity normal

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/fieldops-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/fieldops-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker-config:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config

  repository-policy:
    name: Repository evidence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final image policy
        run: python3 scripts/verify-image-policy.py
