name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FieldOps.sln
      - name: Build
        run: dotnet build FieldOps.sln --configuration Release --no-restore
      - name: Unit tests
        run: >
          dotnet test
          tests/FieldOps.UnitTests/FieldOps.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal
      - name: NuGet vulnerability scan
        run: >
          dotnet list FieldOps.sln
          package
          --vulnerable
          --include-transitive

  postgres-integration:
    name: PostgreSQL integration and API security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fieldops
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldops_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldops -d fieldops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIELDOPS_TEST_CONNECTION: Host=localhost;Port=5432;Database=fieldops;Username=fieldops;Password=fieldops_test_password
      ConnectionStrings__FieldOps: Host=localhost;Port=5432;Database=fieldops;Username=fieldops;Password=fieldops_test_password
      Authentication__Jwt__Issuer: FieldOps.IntegrationTests
      Authentication__Jwt__Audience: FieldOps.IntegrationTests.Client
      Authentication__Jwt__SigningKey: fieldops-ci-integration-tests-signing-key-2026-at-least-forty-eight-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FieldOps.sln
      - name: Build integration tests
        run: >
          dotnet build
          tests/FieldOps.IntegrationTests/FieldOps.IntegrationTests.csproj
          --configuration Release
          --no-restore
      - name: Run PostgreSQL and API security tests
        run: >
          dotnet test
          tests/FieldOps.IntegrationTests/FieldOps.IntegrationTests.csproj
          --configuration Release
          --no-build
          --verbosity normal

  frontend:
    name: Frontend lint, tests, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/fieldops-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/fieldops-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: npm vulnerability scan
        run: npm audit --audit-level=moderate

  docker:
    name: Docker configuration and image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose configuration
        run: docker compose config
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: fieldops-ci-compose-password
          JWT_SIGNING_KEY: fieldops-ci-compose-signing-key-2026-at-least-forty-eight-characters
        run: >
          docker compose
          -f deploy/docker-compose.production.yml
          config
      - name: Build API image
        run: >
          docker build
          -f deploy/Dockerfile.api
          -t fieldops-api:ci
          .
      - name: Build web image
        run: >
          docker build
          -f deploy/Dockerfile.web
          -t fieldops-web:ci
          .

  repository-quality:
    name: Documentation and repository quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation
        run: python3 scripts/validate-documentation.py
      - name: Validate public names and wording
        run: python3 scripts/validate-public-surface.py
      - name: Validate application screens
        run: python3 scripts/validate-repository-assets.py
